name: Generate AI Insights

on:
  # Run when data is updated
  push:
    paths:
      - 'public/data/**'
      - 'data/**'
      - 'scripts/generate-insights.js'
  # Run manually
  workflow_dispatch:
  # Run on schedule (daily)
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  generate-insights:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install
      
      - name: Generate AI Insights
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/generate-insights.js
      
      - name: Commit insights
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/insights.json || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update AI insights [skip ci]"
            git push
          fi
