name: Generate AI Insights

on:
  # Run when data is updated
  push:
    paths:
      - 'public/data/**'
      - 'data/**'
  # Run manually
  workflow_dispatch:
  # Run on schedule (daily)
  schedule:
    - cron: '0 0 * * *'

jobs:
  generate-insights:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install
      
      - name: Generate AI Insights
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-insights.js
      
      - name: Commit insights
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/insights.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update AI insights"
          git push
